spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:finflow}
    # No fallback: an unset SPRING_DATASOURCE_PASSWORD now fails Spring Boot's own placeholder
    # resolution at startup instead of silently connecting with 'finflow123' — the value that used
    # to be hardcoded right here and is now public knowledge to anyone who has ever read this repo.
    # docker-compose.yml already requires it via `:?`; this closes the same hole for a bare `mvn
    # spring-boot:run`. Local development still works — application-local.yml sets its own password
    # — and `.env` supplies it for everything else.
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        enable_lazy_load_no_trans: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true
    ignore-missing-migrations: true
    out-of-order: true
    validate-on-migrate: false
    baseline-on-migrate: false
    ignore-migration-patterns: "*:failed,*:ignored,*:missing"
  jackson:
    serialization:
      fail-on-empty-beans: false
    default-property-inclusion: non_null
  servlet:
    # Merged in from the Statement Analyzer app: bank/card statement uploads (PDF/CSV/XLSX) need
    # room well beyond Spring's 1MB default, or StatementController's upload endpoint 500s on any
    # real-world statement.
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

jwt:
  # No fallback, deliberately. Anyone holding this secret can mint a session for any account, and a
  # default that lets the app start anyway is worse than one that refuses to: compose already
  # enforces this with `:?`, but a bare `mvn spring-boot:run` (an IDE run config, a stray jar, a
  # different orchestrator) previously fell through to 'default-secret-change-in-production' — a
  # string sitting in this file, readable by anyone who has ever cloned the repo. Now every launch
  # path fails loudly at startup instead. Set it with:  export JWT_SECRET=$(openssl rand -base64 48)
  # `set -a && . .env && set +a` (see RUNNING.md) supplies it for a local run.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    # Port wildcards, because the Vite dev server does not always land on 3000 — if the Docker
    # frontend already holds that port it moves to 3001, and the browser's Origin header survives
    # the dev proxy, so an exact-match list rejects the request with "Invalid CORS request".
    # In production the frontend is served same-origin behind nginx and this should not list
    # localhost at all:  CORS_ALLOWED_ORIGINS=https://finflow.example.com
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

server:
  # Overridable so a local backend can run alongside the Docker one without editing this file:
  #   SERVER_PORT=9080 mvn spring-boot:run -Dspring-boot.run.profiles=local
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,text/plain
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

# API docs (/v3/api-docs, /swagger-ui) are off unless API_DOCS_ENABLED=true: a full map of every
# endpoint shouldn't be served to anyone who can reach the server.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.finflow: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
